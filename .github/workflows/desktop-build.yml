name: Build desktop installers

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: dist:win
            files: Codepro-Client/dist/*.exe
          - os: macos-latest
            platform: macos
            command: dist:mac
            files: Codepro-Client/dist/*-mac-*.dmg
          - os: ubuntu-latest
            platform: linux
            command: dist:linux
            files: Codepro-Client/dist/*-linux-*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Codepro-Client
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          path: Codepro-Client
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: codeprooj-client-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
